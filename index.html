<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MP3 player</title>
        <link rel="stylesheet" href="./style.css" type="text/css">
        <script src="./script.js" defer></script>
        <script src="https://kit.fontawesome.com/808cccea7e.js" crossorigin="anonymous"></script>

        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <meta name="google-site-verification" content="ZOb5EXMRBKRnp_Zcq1BIXoZIBKemylpTrV7Y_T0unE8" />
    </head>
    <body>
        <h1>MP3 Player</h1>

        <div class="playlist-selector-container">
            <label for="playlist-select">Choose a Playlist:</label>
            <select id="playlist-select">
                <!-- JavaScript will populate options dynamically here -->
            </select>
            <div class="playlist-refresh-controls">
                <button id="refresh-index" type="button" aria-label="Refresh playlist index" title="Refresh playlist index">
                    <span class="fa-solid fa-list-ul" aria-hidden="true"></span>
                    <span class="fa-solid fa-arrows-rotate refresh-indicator" aria-hidden="true"></span>
                </button>
                <button id="refresh-playlist" type="button" aria-label="Refresh selected playlist" title="Refresh selected playlist">
                    <span class="fa-solid fa-music" aria-hidden="true"></span>
                    <span class="fa-solid fa-arrows-rotate refresh-indicator" aria-hidden="true"></span>
                </button>
            </div>
        </div>

        <div class='player-container'>
            <img src="" id='album-art' alt="Album artwork">
            <p id='song-name'></p>
            <p id='album-name'></p>
            <p id='album-artist'></p>

            <div class="seek-container" aria-label="Playback position">
                <span id="current-time" aria-live="polite">0:00</span>
                <input id="seek-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek through the current track">
                <span id="duration" aria-live="polite">0:00</span>
            </div>

            <button id='previous-track' aria-label="Previous track"><span class='fa-solid fa-backward-step' aria-hidden="true"></span></button> <button id='play-pause' aria-label="Play or pause"><span id='play-pause-icon' class='fa-solid fa-play' aria-hidden="true"></span></button> <button id='next-track' aria-label="Next track"><span class='fa-solid fa-forward-step' aria-hidden="true"></span></button> <button id='loop-toggle' aria-label="Loop mode: off" title="Loop mode: off" aria-pressed="false"><span class='fa-solid fa-repeat' aria-hidden="true"></span><span id='loop-one-indicator' aria-hidden="true" hidden>1</span></button>
            <audio id="audio" src=""></audio>
        </div>

        <section id="playlist-section" class="track-list" aria-labelledby="playlist-list-title" hidden>
            <h2 id="playlist-list-title">Tracks</h2>
            <ol id="playlist-menu"></ol>
        </section>
    </body>
</html>
