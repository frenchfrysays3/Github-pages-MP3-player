<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MP3 player</title>
        <link rel="stylesheet" href="./style.css" type="text/css">
        <script src="./script.js"></script>
        <script src="https://kit.fontawesome.com/808cccea7e.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <h1>MP3 Player</h1>
        <div class='player-container'>
            <img src="" id='album-art'>
            <p id='song-name'></p>
            <p id='album-name'></p>
            <p id='album-artist'></p>
            <button type='button' id='previous-track'><span class='fa-solid fa-backward-step'></span></button> <button type='button' id='play-pause'><span class='fa-solid fa-play'></span></button> <button type='button' id='next-track'><span class='fa-solid fa-forward-step'></span></button>
        </div>
    </body>
</html>
